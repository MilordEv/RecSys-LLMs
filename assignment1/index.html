<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lunch Menu Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #ff6b6b;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        
        .description {
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .lunch-display {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin: 25px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .food-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        
        .food-name {
            font-size: 2rem;
            color: #333;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .generate-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .blacklist-btn {
            background-color: white;
            color: #d64545;
            border: 2px solid #ff6b6b;
            border-radius: 50px;
            padding: 13px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .blacklist-btn:hover:not(:disabled) {
            background-color: #fff1f1;
            transform: translateY(-3px);
        }

        .generate-btn:disabled,
        .blacklist-btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
            box-shadow: none;
        }

        .blacklist-summary {
            min-height: 24px;
            margin-top: 16px;
            color: #666;
            font-size: 0.9rem;
        }

        .clear-blacklist-btn {
            margin-left: 8px;
            padding: 0;
            color: #c43d3d;
            background: none;
            border: none;
            font: inherit;
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
        }
        
        .generate-btn:hover:not(:disabled) {
            background-color: #ff5252;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
        }
        
        .generate-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 0.9rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .food-name {
                font-size: 1.6rem;
            }
            
            .generate-btn {
                padding: 12px 30px;
                font-size: 1.1rem;
            }

            .actions {
                flex-direction: column;
            }

            .blacklist-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-utensils"></i> Random Lunch Generator</h1>
        <p class="description">Struggling to decide what to eat? Let us choose for you with just one click!</p>
        
        <div class="lunch-display">
            <div class="food-icon"><i class="fas fa-question"></i></div>
            <div class="food-name">What's for lunch?</div>
        </div>
        
        <div class="actions">
            <button class="generate-btn" id="generateBtn">
                <i class="fas fa-random"></i> Generate Lunch!
            </button>
            <button class="blacklist-btn" id="blacklistBtn" disabled>
                <i class="fas fa-ban"></i> Blacklist this dish
            </button>
        </div>

        <p class="blacklist-summary" aria-live="polite">
            <span id="blacklistStatus">No dishes blacklisted this session.</span>
            <button class="clear-blacklist-btn" id="clearBlacklistBtn" hidden>Clear blacklist</button>
        </p>
        
        <p class="footer">Click the button again if you can't decide!</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generateBtn');
            const foodIcon = document.querySelector('.food-icon');
            const foodName = document.querySelector('.food-name');
            const lunchDisplay = document.querySelector('.lunch-display');
            const blacklistBtn = document.getElementById('blacklistBtn');
            const clearBlacklistBtn = document.getElementById('clearBlacklistBtn');
            const blacklistStatus = document.getElementById('blacklistStatus');
            
            // Array of lunch options with corresponding Font Awesome icons
            const lunchMenu = [
                { name: "Pizza", icon: "fas fa-pizza-slice", cluster: "italian" },
                { name: "Sushi", icon: "fas fa-fish", cluster: "bowls" },
                { name: "Burger", icon: "fas fa-hamburger", cluster: "handheld" },
                { name: "Salad", icon: "fas fa-leaf", cluster: "light-meals" },
                { name: "Tacos", icon: "fas fa-utensil-spoon", cluster: "handheld" },
                { name: "Ramen", icon: "fas fa-bowl-food", cluster: "soups" },
                { name: "Sandwich", icon: "fas fa-bread-slice", cluster: "handheld" },
                { name: "Pasta", icon: "fas fa-plate-wheat", cluster: "italian" },
                { name: "Curry", icon: "fas fa-mortar-pestle", cluster: "bowls" },
                { name: "Steak", icon: "fas fa-drumstick-bite", cluster: "grill" },
                { name: "Soup", icon: "fas fa-mug-hot", cluster: "soups" },
                { name: "BBQ", icon: "fas fa-fire", cluster: "grill" },
                { name: "Hot Dog", icon: "fas fa-hotdog", cluster: "handheld" },
                { name: "Fried Rice", icon: "fas fa-bowl-rice", cluster: "bowls" },
                { name: "Falafel Wrap", icon: "fas fa-seedling", cluster: "handheld" },
                { name: "Grilled Chicken", icon: "fas fa-drumstick-bite", cluster: "grill" },
                { name: "Seafood Bowl", icon: "fas fa-shrimp", cluster: "bowls" },
                { name: "Cheese Toastie", icon: "fas fa-cheese", cluster: "handheld" },
                { name: "Omelette", icon: "fas fa-egg", cluster: "light-meals" },
                { name: "Veggie Stir-fry", icon: "fas fa-carrot", cluster: "light-meals" },
                { name: "Chili", icon: "fas fa-pepper-hot", cluster: "light-meals" },
                { name: "Fish & Chips", icon: "fas fa-fish-fins", cluster: "grill" },
                { name: "Avocado Toast", icon: "fas fa-bread-slice", cluster: "handheld" },
                { name: "Pho", icon: "fas fa-bowl-food", cluster: "soups" },
                { name: "Lasagna", icon: "fas fa-layer-group", cluster: "italian" },
                { name: "Risotto", icon: "fas fa-bowl-rice", cluster: "italian" },
                { name: "Gnocchi", icon: "fas fa-plate-wheat", cluster: "italian" },
                { name: "Ravioli", icon: "fas fa-square", cluster: "italian" },
                { name: "Calzone", icon: "fas fa-pizza-slice", cluster: "italian" },
                { name: "Poke Bowl", icon: "fas fa-shrimp", cluster: "bowls" },
                { name: "Burrito Bowl", icon: "fas fa-bowl-rice", cluster: "bowls" },
                { name: "Buddha Bowl", icon: "fas fa-leaf", cluster: "bowls" },
                { name: "Tomato Soup", icon: "fas fa-mug-hot", cluster: "soups" },
                { name: "Miso Soup", icon: "fas fa-bowl-food", cluster: "soups" },
                { name: "Lentil Soup", icon: "fas fa-bowl-food", cluster: "soups" },
                { name: "Chowder", icon: "fas fa-mug-hot", cluster: "soups" },
                { name: "Grilled Salmon", icon: "fas fa-fish", cluster: "grill" },
                { name: "Kebab", icon: "fas fa-fire", cluster: "grill" },
                { name: "Roast Vegetables", icon: "fas fa-pepper-hot", cluster: "grill" },
                { name: "Quiche", icon: "fas fa-egg", cluster: "light-meals" },
                { name: "Greek Salad", icon: "fas fa-leaf", cluster: "light-meals" },
                { name: "Fruit Bowl", icon: "fas fa-apple-whole", cluster: "light-meals" }
            ];
            let previousLunchCluster = null;
            const recentLunchNames = [];
            const dishCooldownLength = 3;
            const blacklistedLunchNames = new Set();
            let currentLunch = null;

            function updateBlacklistStatus() {
                const count = blacklistedLunchNames.size;
                const remainingCount = lunchMenu.length - count;
                const remainingText = remainingCount < 10
                    ? ` ${remainingCount} ${remainingCount === 1 ? 'dish' : 'dishes'} left.`
                    : '';
                blacklistStatus.textContent = count === 0
                    ? 'No dishes blacklisted this session.'
                    : `${count} ${count === 1 ? 'dish' : 'dishes'} blacklisted this session.${remainingText}`;
                clearBlacklistBtn.hidden = count === 0;
            }

            // Exclude the previous cluster and dishes shown in the last three recommendations.
            function getNextLunchIndex() {
                let eligibleIndices = lunchMenu
                    .map((lunch, index) => ({ lunch, index }))
                    .filter(({ lunch }) => (
                        !blacklistedLunchNames.has(lunch.name) &&
                        lunch.cluster !== previousLunchCluster &&
                        !recentLunchNames.includes(lunch.name)
                    ))
                    .map(({ index }) => index);

                // Preserve the dish cooldown if future menu changes leave no other cluster available.
                if (eligibleIndices.length === 0) {
                    eligibleIndices = lunchMenu
                        .map((lunch, index) => ({ lunch, index }))
                        .filter(({ lunch }) => (
                            !blacklistedLunchNames.has(lunch.name) &&
                            !recentLunchNames.includes(lunch.name)
                        ))
                        .map(({ index }) => index);
                }

                // If very few dishes remain, prefer honoring the blacklist over the cooldown.
                if (eligibleIndices.length === 0) {
                    eligibleIndices = lunchMenu
                        .map((lunch, index) => ({ lunch, index }))
                        .filter(({ lunch }) => !blacklistedLunchNames.has(lunch.name))
                        .map(({ index }) => index);
                }

                if (eligibleIndices.length === 0) {
                    return -1;
                }

                return eligibleIndices[Math.floor(Math.random() * eligibleIndices.length)];
            }
            
            // Function to generate random lunch
            function generateRandomLunch() {
                // Remove fade-in class if it exists
                lunchDisplay.classList.remove('fade-in');
                currentLunch = null;
                generateBtn.disabled = true;
                blacklistBtn.disabled = true;
                
                // Get a random lunch option
                const randomIndex = getNextLunchIndex();
                if (randomIndex === -1) {
                    foodIcon.innerHTML = '<i class="fas fa-ban"></i>';
                    foodName.textContent = 'No dishes available';
                    return;
                }

                const selectedLunch = lunchMenu[randomIndex];
                previousLunchCluster = selectedLunch.cluster;
                recentLunchNames.push(selectedLunch.name);
                if (recentLunchNames.length > dishCooldownLength) {
                    recentLunchNames.shift();
                }
                
                // Briefly show loading state
                foodIcon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                foodName.textContent = "Thinking...";
                
                // After a short delay, show the selected lunch
                setTimeout(() => {
                    foodIcon.innerHTML = `<i class="${selectedLunch.icon}"></i>`;
                    foodName.textContent = selectedLunch.name;
                    currentLunch = selectedLunch;
                    generateBtn.disabled = false;
                    blacklistBtn.disabled = false;
                    
                    // Add animation class
                    lunchDisplay.classList.add('fade-in');
                }, 500);
            }
            
            // Add click event to button
            generateBtn.addEventListener('click', generateRandomLunch);

            blacklistBtn.addEventListener('click', function() {
                if (!currentLunch) {
                    return;
                }

                blacklistedLunchNames.add(currentLunch.name);
                updateBlacklistStatus();
                generateRandomLunch();
            });

            clearBlacklistBtn.addEventListener('click', function() {
                blacklistedLunchNames.clear();
                updateBlacklistStatus();
                generateBtn.disabled = false;
                blacklistBtn.disabled = currentLunch === null;
            });
            
            // Generate a random lunch on page load
            updateBlacklistStatus();
            generateRandomLunch();
        });
    </script>
</body>
</html>
